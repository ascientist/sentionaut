[project]
site_name = "Sentionaut"
site_description = "GPU-native prosthetic vision world models, classified by modality."
site_url = "https://ascientist.github.io/sentionaut/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/ascientist/sentionaut"
repo_name = "ascientist/sentionaut"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Nomenclature" = "nomenclature.md" },
  { "Models" = [
    "models/index.md",
    "models/demos.md",
    "models/axonmap.md",
    "models/axonmap-world.md",
    "models/scoreboard.md",
    "models/dynaphos.md",
    "models/world-model.md",
  ] },
  { "NeuroStim (control)" = [
    "neurostim-formulation.md",
    "neurostim.md",
    "neurostim-percept.md",
  ] },
  { "References" = "references.md" },
]

[project.theme]
logo = "assets/sentionaut-mark.png"
favicon = "assets/favicon.png"

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "red"

# Math: $...$ / $$...$$ in Markdown (also rendered natively on GitHub).
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
